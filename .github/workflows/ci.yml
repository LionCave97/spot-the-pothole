name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      supabase: ${{ steps.filter.outputs.supabase }}
      worker: ${{ steps.filter.outputs.worker }}
      workflow_file: ${{ steps.filter.outputs.workflow_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            shared:
              - 'shared/**'
            web:
              - 'web/**'
              - 'shared/**'
            android:
              - 'android/**'
              - 'shared/**'
            ios:
              - 'ios/**'
              - 'shared/**'
            supabase:
              - 'supabase/**'
            worker:
              - 'worker/**'
            workflow_file:
              - '.github/workflows/ci.yml'

  shared:
    needs: path-filter
    if: needs.path-filter.outputs.shared == 'true' || needs.path-filter.outputs.workflow_file == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    needs: path-filter
    if: needs.path-filter.outputs.web == 'true' || needs.path-filter.outputs.workflow_file == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          NUXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NUXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  supabase-security:
    needs: path-filter
    if: needs.path-filter.outputs.supabase == 'true' || needs.path-filter.outputs.workflow_file == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Stop leftover local stack (runner reuse)
        run: supabase stop --no-backup || true
      - name: Start Supabase and apply migrations
        run: |
          supabase start -x imgproxy,edge-runtime,logflare,vector
          supabase db reset
      - name: Run security SQL tests
        run: |
          chmod +x supabase/tests/run_security_tests.sh
          bash supabase/tests/run_security_tests.sh

  android:
    needs: path-filter
    if: needs.path-filter.outputs.android == 'true' || needs.path-filter.outputs.workflow_file == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: demo-anon-key

  ios:
    needs: path-filter
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.path-filter.outputs.ios == 'true' || needs.path-filter.outputs.workflow_file == 'true')
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('ios/**/*.swift', 'ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: xcodegen generate
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SpotThePothole.xcodeproj \
            -scheme SpotThePothole
      - name: Build and test (Simulator, no signing)
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); devs=[x for xs in d['devices'].values() for x in xs if x.get('isAvailable') and 'iPhone' in x.get('name','')]; print(devs[0]['udid'] if devs else '')")
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No iOS Simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $SIMULATOR_ID"
          xcodebuild \
            -project SpotThePothole.xcodeproj \
            -scheme SpotThePothole \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -sdk iphonesimulator \
            build test \
            CODE_SIGNING_ALLOWED=NO

  supabase-migrations:
    needs: path-filter
    if: needs.path-filter.outputs.supabase == 'true' || needs.path-filter.outputs.workflow_file == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Stop leftover local stack (runner reuse)
        run: supabase stop --no-backup || true
      - name: Start local database
        run: supabase db start
      - name: Apply migrations and seed
        run: supabase db reset
      - name: Run SQL tests (if any)
        run: |
          if [ -d tests ] && find tests -name '*.sql' -print -quit | grep -q .; then
            supabase test db
          else
            echo "No supabase/tests SQL files; skipping supabase test db."
          fi

  worker:
    needs: path-filter
    if: needs.path-filter.outputs.worker == 'true' || needs.path-filter.outputs.workflow_file == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip when worker package is not present
        id: worker_pkg
        run: |
          if [ -f worker/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No worker/ package in this checkout; skipping worker tests."
          fi
      - uses: actions/setup-python@v5
        if: steps.worker_pkg.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - if: steps.worker_pkg.outputs.present == 'true'
        working-directory: worker
        run: pip install -r requirements.txt
      - if: steps.worker_pkg.outputs.present == 'true'
        working-directory: worker
        run: chmod +x scripts/download_models.sh && ./scripts/download_models.sh
      - if: steps.worker_pkg.outputs.present == 'true'
        working-directory: worker
        run: PYTHONPATH=. pytest -q

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - path-filter
      - shared
      - web
      - supabase-security
      - android
      - ios
      - supabase-migrations
      - worker
    steps:
      - name: Aggregate CI (skipped jobs count as success)
        env:
          PATH_FILTER: ${{ needs.path-filter.result }}
          SHARED: ${{ needs.shared.result }}
          WEB: ${{ needs.web.result }}
          SUPABASE_SECURITY: ${{ needs.supabase-security.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          SUPABASE_MIGRATIONS: ${{ needs.supabase-migrations.result }}
          WORKER: ${{ needs.worker.result }}
        run: |
          ok() {
            case "$1" in
              success|skipped) ;;
              *)
                echo "::error::Job $2 ended with: $1"
                exit 1
                ;;
            esac
          }
          ok "$PATH_FILTER" path-filter
          ok "$SHARED" shared
          ok "$WEB" web
          ok "$SUPABASE_SECURITY" supabase-security
          ok "$ANDROID" android
          ok "$IOS" ios
          ok "$SUPABASE_MIGRATIONS" supabase-migrations
          ok "$WORKER" worker
          echo "All required CI jobs succeeded or were skipped (path filter)."
