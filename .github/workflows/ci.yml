name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NUXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NUXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: demo-anon-key

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: xcodegen generate
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SpotThePothole.xcodeproj \
            -scheme SpotThePothole
      - name: Build and test (Simulator, no signing)
        run: |
          xcodebuild \
            -project SpotThePothole.xcodeproj \
            -scheme SpotThePothole \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -sdk iphonesimulator \
            build test \
            CODE_SIGNING_ALLOWED=NO

  supabase-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database
        run: supabase db start
      - name: Apply migrations and seed
        run: supabase db reset
      - name: Run SQL tests (if any)
        run: |
          if [ -d tests ] && find tests -name '*.sql' -print -quit | grep -q .; then
            supabase test db
          else
            echo "No supabase/tests SQL files; skipping supabase test db."
          fi
