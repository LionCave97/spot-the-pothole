name: SpotThePothole
options:
  bundleIdPrefix: za.spotthepothole
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SUPABASE_URL: http://127.0.0.1:54321
    SUPABASE_ANON_KEY: demo-anon-key

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.31.0

targets:
  SpotThePothole:
    type: application
    platform: iOS
    sources:
      - path: SpotThePothole
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: SpotThePothole
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spot the Pothole
        INFOPLIST_KEY_NSCameraUsageDescription: Live photo required to spot a pothole.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: GPS is required to place potholes on the map.
    scheme:
      testTargets:
        - SpotThePotholeTests

  SpotThePotholeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SpotThePotholeTests
    settings:
      base:
        PRODUCT_NAME: SpotThePotholeTests
    dependencies:
      - target: SpotThePothole
